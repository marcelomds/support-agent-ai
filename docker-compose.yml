# Local infrastructure. Start with: docker compose up -d
services:
  postgres:
    # Postgres 16 with the pgvector extension pre-installed (used from phase 3 on).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: streambox
      POSTGRES_PASSWORD: streambox
      POSTGRES_DB: streambox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streambox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Backing store for BullMQ queues (used from phase 3 on).
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
